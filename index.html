<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameVault 游戏鉴赏库</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/index.css">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="./index.html">🎮 GameVault</a>
  </header>
  
  <main>
    <!-- 全屏首屏视觉区 -->
    <section id="hero-section">
      <div class="hero-content">
        <h1 class="hero-title">GameVault</h1>
        <p class="hero-subtitle">记录我的游玩足迹，分享深度体验。</p>
        <button id="scroll-down-btn" class="scroll-hint">下滑探索</button>
      </div>
    </section>

    <!-- 真实内容区（首页渲染的列表将挂载到这里） -->
    <section id="content-section">
      <div id="app"></div>
    </section>

    <!-- 右下角悬浮返回按钮 -->
    <button id="explore-btn" class="explore-fab" aria-label="返回游戏列表">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
        stroke-linejoin="round">
        <!-- 向上箭头 -->
        <path d="M12 19V5M5 12l7-7 7 7" />
      </svg>
    </button>
  </main>

  <!-- ================= 脚本引入区 ================= -->
  
  <!-- 1. 基础数据与渲染引擎 -->
  <script src="./js/registry.js"></script>
  <script src="./js/renderer.js"></script>

  <!-- 2. 游戏长文数据（全部引入） -->
  <script src="./js/game/apex.js"></script>
  <script src="./js/game/battlefield5.js"></script>
  <script src="./js/game/cities-skylines.js"></script>
  <script src="./js/game/cities-skylines2.js"></script>
  <script src="./js/game/civilization6.js"></script>
  <script src="./js/game/cod.js"></script>
  <script src="./js/game/cs2.js"></script>
  <script src="./js/game/euro-truck.js"></script>
  <script src="./js/game/f1-24.js"></script>
  <script src="./js/game/fc26.js"></script>
  <script src="./js/game/forza-horizon5.js"></script>
  <script src="./js/game/forza-motorsport.js"></script>
  <script src="./js/game/human-fall-flat.js"></script>
  <script src="./js/game/it-takes-two.js"></script>
  <script src="./js/game/l4d2.js"></script>
  <script src="./js/game/msfs.js"></script>
  <script src="./js/game/no-mans-sky.js"></script>
  <script src="./js/game/peak.js"></script>
  <script src="./js/game/phasmophobia.js"></script>
  <script src="./js/game/planet-coaster.js"></script>
  <script src="./js/game/pragmata.js"></script>
  <script src="./js/game/raft.js"></script>
  <script src="./js/game/ready-or-not.js"></script>
  <script src="./js/game/squad.js"></script>
  <script src="./js/game/stardew-valley.js"></script>
  <script src="./js/game/stellar-blade.js"></script>
  <script src="./js/game/terraria.js"></script>
  <script src="./js/game/the-forest.js"></script>
  <script src="./js/game/titanfall2.js"></script>
  <script src="./js/game/tlou1.js"></script>
  <script src="./js/game/tlou2.js"></script>

  <!-- 3. 首页逻辑控制 -->
  <script src="./js/index.js"></script>
</body>

</html>
