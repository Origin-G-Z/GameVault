<head>

  <meta name="description" content="GameVault 是一个纯前端的个人游戏鉴赏库，收录 31 款游戏，包含简单评测长文、平台与类型多维筛选、关键词搜索与收藏功能。">
  <meta name="keywords" content="GameVault,游戏鉴赏,游戏评测,游戏库,单机游戏,FPS,模拟经营,竞速,Web前端">
  <meta name="author" content="高梓源">

  <!-- ================= 社交分享卡片（OG / Twitter） ================= -->
  <meta property="og:type" content="website">

  <meta property="og:title" content="GameVault 游戏鉴赏库">

<body id="top">
  <header class="site-header">
    <div class="header-left">
      <a class="brand" href="./index.html">🎮 GameVault</a>

      <!-- GitHub 仓库入口 -->
      <a class="header-github"
         href="https://github.com/Origin-G-Z/GameVault"
         target="_blank"
         rel="noopener noreferrer"
         title="查看 GitHub 仓库"
         aria-label="GitHub 仓库">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        <span class="github-label">GitHub</span>
      </a>
    </div>

    <!-- 右侧操作区：主题色 + 搜索 -->
    <div class="header-right">
      <!-- 主题色选择器（由 js/theme.js 渲染色点） -->
      <div class="theme-picker" id="theme-picker" aria-label="主题色选择"></div>

      <!-- 顶部迷你搜索框：与页面内吸顶筛选框的搜索保持同步 -->
      <div class="header-search" id="header-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="header-search-input" placeholder="搜索游戏..." autocomplete="off">
      </div>
    </div>
  </header>
  
  <main>
    <!-- 全站氛围极光：固定层，垫在内容之下，随主题色缓慢漂移 -->
    <div class="page-ambient" aria-hidden="true">
      <span class="amb-blob amb-1"></span>
      <span class="amb-blob amb-2"></span>
      <span class="amb-blob amb-3"></span>
    </div>

    <!-- 全屏首屏视觉区 -->
    <section id="hero-section">
      <!-- 主题色动态背景：全部由 CSS 生成，随主题色实时变化 -->
      <div class="hero-backdrop" aria-hidden="true">
        <!-- 极光光斑 -->
        <div class="hero-aurora">
          <span class="blob blob-1"></span>
          <span class="blob blob-2"></span>
          <span class="blob blob-3"></span>
        </div>
        <!-- 向前滚动的透视网格 -->
        <div class="hero-grid"></div>
        <!-- 地平线高光 -->
        <div class="hero-horizon"></div>
        <!-- 缓慢扫过的高光 -->
        <div class="hero-sweep"></div>
        <!-- 四周压暗，保证白色文字清晰 -->
        <div class="hero-veil"></div>
      </div>

      <div class="hero-content">
        <h1 class="hero-title">GameVault</h1>
        <p class="hero-subtitle">记录我的游玩足迹，分享游戏体验。</p>
        <button id="scroll-down-btn" class="scroll-hint">下滑探索</button>
      </div>
    </section>

    <!-- 真实内容区（首页渲染的列表将挂载到这里） -->
    <section id="content-section">
      <!-- 游戏库光效：贴着内容滚动，随主题色缓慢漂移 -->
      <div class="library-glow" aria-hidden="true">
        <span class="lg lg-1"></span>
        <span class="lg lg-2"></span>
        <span class="lg lg-3"></span>
      </div>

      <div id="app"></div>
    </section>

    <!-- 右下角悬浮操作区 -->
    <div class="fab-stack">
      <!-- 随机抽一款游戏 -->
      <button id="lucky-btn" class="fab fab-lucky" aria-label="随机推荐一款游戏" title="随机玩一款">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3h5v5M4 20 20.5 3.5M21 16v5h-5M15 15l6 6M4 4l5 5" />
        </svg>
        <span class="fab-tip">今天玩什么</span>
      </button>

      <!-- 返回游戏列表 -->
      <button id="explore-btn" class="explore-fab fab" aria-label="返回游戏列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <!-- 向上箭头 -->
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
      </button>
    </div>
  </main>

  <!-- ================= 页面底部版权页脚 ================= -->
  <footer class="site-footer">
    <div class="footer-inner">
      <!-- 左上角品牌区 -->
      <div class="footer-brand">
        <span class="footer-logo">🎮 GameVault</span>
        <p class="footer-slogan">记录我的游玩足迹，分享深度体验。</p>
      </div>

      <!-- 右侧：返回顶部 + 技术栈 + 版权，垂直排列 -->
      <div class="footer-right">
        <nav class="footer-links">
          <a href="#top" class="footer-link" id="footer-top-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
            返回顶部
          </a>
        </nav>

        <p class="footer-tech">
          技术栈：<span>HTML5</span><span>CSS3</span><span>原生 JavaScript</span>
        </p>

        <p class="footer-badge">
          <span class="badge-ver">v4.7.1</span>
          <span class="badge-sep">·</span>
          <span>纯静态</span>
          <span class="badge-sep">·</span>
          <span>零依赖</span>
        </p>

        <p class="footer-copy">© 2026 GameVault · 保留所有权利</p>
      </div>
    </div>
  </footer>
